<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskHero — Super Admin</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<section id="loginPage" class="view active" style="min-height:100vh;display:none;align-items:center;justify-content:center;padding:20px">
  <div class="panel" style="max-width:420px;width:100%">
    <div class="auth-head"><div style="font-size:2rem">🛡️</div><h2>TaskHero Super Admin</h2><p>Authorised access only</p></div>
    <form data-form="super-login" novalidate>
      <div class="field"><label for="u">Username</label><input id="u" name="username" required autocomplete="username" /></div>
      <div class="field"><label for="p">Password</label><input id="p" name="password" type="password" required autocomplete="current-password" /></div>
      <div class="form-error" role="alert"></div>
      <button class="btn btn-primary btn-block" type="submit">Access panel →</button>
    </form>
    <p class="auth-switch"><a href="/">← Back to main site</a></p>
  </div>
</section>

<section id="panel" class="view" style="min-height:100vh">
  <nav class="dash-nav"><div class="logo"><span class="logo-icon">🛡️</span><span class="logo-text">Task<span class="accent">Hero</span></span><span class="school-chip">Super admin</span></div>
    <div class="dash-user"><button class="btn btn-ghost btn-sm theme-toggle" data-action="toggle-theme" aria-label="Switch light/dark theme">🌓</button><button class="btn btn-ghost btn-sm" data-action="logout">Log out</button></div></nav>
  <main class="dash-main" id="content" style="max-width:1100px;margin:0 auto"></main>
</section>

<div id="toast" class="toast hidden" role="status"></div>
<div id="modalRoot"></div>
<script type="module" src="/js/superadmin.js"></script>
</body>
</html>
